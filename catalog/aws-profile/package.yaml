kind: provision
name: aws-profile
title: AWS profile
logo: logo.svg
description: >
  An AWS profile in each sandbox, signed in to your development role. The
  repository's normal AWS CLI, SDK and secret loader use it unchanged, and its
  credentials refresh through sbx, so no SSO login is needed inside a sandbox.
  It grants AWS access; it does not isolate shared AWS data.
requires:
  role: {kind: aws-role, expose: {region: AWS_PROFILE_REGION}}
inputs:
  profile:
    label: Profile name
    help: The AWS profile name the repository expects, for example dev.
    default: sbx
outputs:
  profile: {}
  region: {}
runs: {create: create.py}
timeout: 30s
# The sandbox's AWS config and credential_process helper, and the action it
# calls for a session with the token sbx issues the resource; attaching it
# reaches existing sandboxes on prepare.
runtime: aws.py
actions: {credentials: aws.py}
live: true
scrub: [$HOME/.aws]
env:
  AWS_PROFILE: ${outputs.profile}
  AWS_REGION: ${outputs.region}
  AWS_DEFAULT_REGION: ${outputs.region}
