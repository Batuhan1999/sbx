kind: connection
name: postgres-server
title: Postgres server
logo: logo.svg
description: >
  Connects to a Postgres server you run, at an address sandboxes may reach, with
  an admin role that can create roles and databases.
docs: https://www.postgresql.org/docs/current/sql-createrole.html
inputs:
  url:
    label: Admin URL
    help: "postgresql://role:password@host:5432/postgres, a role that may create roles and databases."
    required: true
    secret: true
check: |
  command -v psql >/dev/null || { echo "psql is not installed on this host"; exit 1; }
  PGCONNECT_TIMEOUT=10 psql "$INPUT_URL" -X -q -tAc "select 1" >/dev/null 2>&1 || { echo "could not connect as that role"; exit 1; }
  PGCONNECT_TIMEOUT=10 psql "$INPUT_URL" -X -q -tAc "select rolcreatedb and rolcreaterole from pg_roles where rolname = current_user" | grep -q t \
    || { echo "the role may not create databases and roles"; exit 1; }
host_tools:
  psql: apt-get -o DPkg::Lock::Timeout=300 install -y -qq postgresql-client
