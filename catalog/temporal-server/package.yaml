kind: connection
name: temporal-server
title: Temporal server
logo: logo.svg
description: >
  Connects to a Temporal server you run, reachable from sandboxes.
inputs:
  address:
    label: Frontend address
    help: "host:7233"
    required: true
check: |
  command -v temporal >/dev/null || { echo "the temporal CLI is not installed on this host"; exit 1; }
  temporal operator cluster health --address "$INPUT_ADDRESS" >/dev/null 2>&1 || { echo "no Temporal at $INPUT_ADDRESS"; exit 1; }
host_tools:
  temporal: curl -sSf https://temporal.download/cli.sh | sh -s -- --dir /usr/local
