kind: provision
name: clickhouse-database
title: ClickHouse database
logo: logo.svg
description: >
  A database per sandbox on your ClickHouse server, with its own user. The
  database and its user are named sbx_, the start of the sandbox's name and a
  random id. Each starts with
  the empty tables of a development database, or with native clones of that
  database's local MergeTree tables.
requires:
  server: { kind: clickhouse-server, expose: { url: CH_URL, user: CH_USER, password: CH_PASSWORD } }
inputs:
  template:
    label: Development database
    default: ''
  mode:
    label: Start with
    choices:
      schema: Empty tables
      clone: Clones of its local MergeTree tables
    default: schema
outputs:
  url: { sensitive: true }
  http_url: { sensitive: true }
  host: {}
  port: {}
  user: {}
  password: { sensitive: true }
  database: {}
runs: { create: provider.py, delete: provider.py, list: provider.py }
timeout: 2m
env:
  CLICKHOUSE_URL: ${outputs.url}
