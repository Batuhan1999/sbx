kind: provision
name: planetscale-branch
title: PlanetScale Postgres branch
logo: logo.svg
description: >
  An empty PostgreSQL development branch per sandbox, with a login that can run
  migrations. Run the repository's migrations and development seeds in setup.
  The parent branch sets the PostgreSQL version; its schema and data are not
  copied. Each branch incurs PlanetScale charges. It never creates databases,
  restores backups, changes production, promotes branches or changes topology.
docs: https://planetscale.com/docs/postgres/branching
requires:
  database:
    kind: planetscale-database
    expose:
      organization: PSCALE_ORGANIZATION
      database: PSCALE_DATABASE
      service_token_id: PSCALE_SERVICE_TOKEN_ID
      service_token: PSCALE_SERVICE_TOKEN
inputs:
  parent:
    label: Parent branch
    help: Existing parent branch name; its schema and data are not copied
    default: main
  region:
    default: ''
    description: Region slug; empty uses the parent's region
  sslrootcert:
    label: CA bundle path
    help: The CA bundle inside the sandbox; change it for custom images. system works with native libpq only.
    default: /etc/ssl/certs/ca-certificates.crt
outputs:
  url: { sensitive: true }
  password: { sensitive: true }
  host: {}
  port: {}
  user: {}
  database: {}
  branch: {}
env:
  DATABASE_URL: ${outputs.url}
runs: { create: provider.py, delete: provider.py, list: provider.py }
timeout: 10m
