kind: provision
name: postgres-clone
title: Postgres clone
logo: logo.svg
description: >
  A database per sandbox, copied from a template database, with its own login
  that owns it. The database and its login are named sbx_ and the sandbox's
  name. Whether the copy is copy-on-write depends on the server and its storage;
  this package does not turn it on. Sandboxes reach the database on the
  connected server's host.
requires:
  server:
    kind: postgres-server
    expose:
      url: PG_ADMIN_URL
inputs:
  connection_limit:
    default: '20'
    description: maximum concurrent connections for this sandbox login; size application pools below this budget
  template:
    label: Template database
    help: the template database
    required: true
  owner_role:
    default: ''
    description: a role the login is a member of, such as the owner of the template's objects
  createrole:
    label: Can create roles
    help: For migrations that create roles.
    default: 'false'
  replication:
    label: Can replicate
    help: Lets the login stream its database, for services such as ElectricSQL.
    default: 'false'
outputs:
  url:
    sensitive: true
  password:
    sensitive: true
  user: {}
  database: {}
  host: {}
  port: {}
env:
  DATABASE_URL: ${outputs.url}
runs:
  create: create.sh
  delete: delete.sh
  list: list.sh
hooks:
  pause: pause.sh
timeout: 5m
host_tools:
  psql: apt-get -o DPkg::Lock::Timeout=300 install -y -qq postgresql-client
