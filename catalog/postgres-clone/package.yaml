kind: provision
name: postgres-clone
title: Postgres clone
logo: logo.svg
description: >
  A database per sandbox, copied from a template database, with its own login
  that owns it. The database and its login are named sbx_, the start of the
  sandbox's name and a random id. Whether the copy is copy-on-write depends on
  the server and its storage;
  this package does not turn it on. Sandboxes reach the database on the
  connected server's host.
requires:
  server:
    kind: postgres-server
    expose:
      url: PG_ADMIN_URL
inputs:
  connection_limit:
    type: integer
    min: 1
    advanced: true
    default: '20'
  template:
    label: Template database
    required: true
  owner_role:
    advanced: true
    default: ''
    help: "Such as the template's owner."
  createrole:
    advanced: true
    label: Can create roles
    help: "For migrations that create roles."
    default: 'false'
  replication:
    advanced: true
    label: Can replicate
    help: "For services such as ElectricSQL."
    default: 'false'
outputs:
  url:
    sensitive: true
  password:
    sensitive: true
  user: {}
  database: {}
  host: {}
  port: {}
env:
  DATABASE_URL: ${outputs.url}
runs:
  create: create.sh
  delete: delete.sh
  list: list.sh
hooks:
  pause: pause.sh
timeout: 5m
host_tools:
  psql: apt-get -o DPkg::Lock::Timeout=300 install -y -qq postgresql-client
