kind: provision
name: tinybird-branch
title: Tinybird branch
logo: logo.svg
description: >
  A Tinybird Forward branch and its own token per sandbox. Each branch copies
  the workspace's resources without data, unless you choose to include the
  latest partition.
docs: https://www.tinybird.co/docs/forward/core-concepts/branches
requires:
  workspace:
    kind: tinybird-workspace
    expose:
      url: TINYBIRD_URL
      workspace: TINYBIRD_WORKSPACE
      token: TINYBIRD_ADMIN_TOKEN
inputs:
  data:
    label: Data
    choices:
      schema: Resources without data
      last_partition: Include the latest partition
    default: schema
outputs:
  url: {}
  workspace: {}
  branch: {}
  token: { sensitive: true }
env:
  TINYBIRD_URL: ${outputs.url}
  TINYBIRD_TOKEN: ${outputs.token}
  TINYBIRD_BRANCH_TOKEN: ${outputs.token}
runs: { create: provider.py, delete: provider.py, list: provider.py }
timeout: 4m
