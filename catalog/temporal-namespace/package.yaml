kind: provision
name: temporal-namespace
title: Temporal namespace
logo: logo.svg
description: >
  A namespace per sandbox on your Temporal server. Each namespace is named sbx-
  and the sandbox's name, and made with the temporal CLI on this host.
requires:
  server:
    kind: temporal-server
    expose:
      address: TEMPORAL_SERVER_ADDRESS
inputs:
  address:
    advanced: true
    label: Server address
    help: "Blank: the connected server's."
    required: false
  retention:
    advanced: true
    help: "Such as 72h."
    default: 72h
outputs:
  address: {}
  namespace: {}
env:
  TEMPORAL_ADDRESS: ${outputs.address}
  TEMPORAL_NAMESPACE: ${outputs.namespace}
runs:
  create: create.sh
  delete: delete.sh
  list: list.sh
timeout: 1m
host_tools:
  temporal: curl -sSf https://temporal.download/cli.sh | sh -s -- --dir /usr/local
