kind: provision
name: neon-branch
title: Neon branch
logo: logo.svg
description: >
  A branch of your Neon project per sandbox, with its own Postgres endpoint,
  deleted with the sandbox. Each branch is copied from the parent you choose, or
  the project's default branch. Blank fields find the application database and
  the login that owns it. Choose a parent when the default branch holds data
  sandboxes should not get.
docs: https://neon.com/docs/introduction/branching
requires:
  project: { kind: neon-project, expose: { api_key: NEON_API_KEY, project: NEON_PROJECT } }
inputs:
  parent:
    label: Copy from
    help: "Blank: the project's default branch."
    default: ''
  database:
    advanced: true
    help: "Blank: the single application database."
    default: ""
  role:
    advanced: true
    label: Login role
    help: "Blank: the database owner."
    default: ''
outputs:
  url: { sensitive: true }
  host: {}
  port: {}
  user: {}
  password: { sensitive: true }
  database: {}
runs: { create: provider.py, delete: provider.py, list: provider.py }
timeout: 3m
env:
  DATABASE_URL: ${outputs.url}
