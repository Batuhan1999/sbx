# Langfuse with all it needs, as one managed server: the web app sandboxes
# send traces to, its worker, and a Postgres, ClickHouse, Redis and S3 store
# of its own, so removing the server removes every part of it. For
# development traces, not for a production Langfuse.
services:
  web:
    image: langfuse/langfuse:4.31.0
    depends_on: &ready
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    environment: &langfuse
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      SALT: ${SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_PASSWORD}
      REDIS_TLS_ENABLED: "false"
      NEXTAUTH_URL: http://${SBX_ADDRESS}:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_DISABLE_SIGNUP: "true"
      # The organization, the project sandboxes trace into, its keys and the
      # person who signs in to the web app, made at the first start.
      LANGFUSE_INIT_ORG_ID: sbx
      LANGFUSE_INIT_ORG_NAME: sbx
      LANGFUSE_INIT_PROJECT_ID: sbx-development
      LANGFUSE_INIT_PROJECT_NAME: development
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-${PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-${SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: admin@langfuse.internal
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${ADMIN_PASSWORD}
      # Listen on every address: the container has one on each of its two networks.
      HOSTNAME: 0.0.0.0
    mem_limit: 1536m
    cpus: 2
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:3000/api/public/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
  worker:
    image: langfuse/langfuse-worker:4.31.0
    depends_on: *ready
    environment: *langfuse
    mem_limit: 1536m
    cpus: 2
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres:/var/lib/postgresql/data]
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
  clickhouse:
    image: clickhouse/clickhouse-server:26.2
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes: [clickhouse:/var/lib/clickhouse, clickhouse-logs:/var/log/clickhouse-server]
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8123/ping >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --requirepass, "${REDIS_PASSWORD}", --maxmemory-policy, noeviction]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes: [redis:/data]
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, "redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    entrypoint: [sh, -c, "mkdir -p /data/langfuse && exec minio server --address :9000 --console-address :9001 /data"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes: [minio:/data]
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres:
  clickhouse:
  clickhouse-logs:
  redis:
  minio:
