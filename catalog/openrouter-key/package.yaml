kind: provision
name: openrouter-key
title: OpenRouter API key
logo: logo.svg
description: >
  An OpenRouter API key per sandbox, with its own credit limit, deleted with the
  sandbox. The limit caps what the key spends; the account's prepaid balance
  still pays for it, so other keys can use that balance up first. Changing a
  setting for an existing sandbox replaces its key the next time the sandbox is
  prepared, and the new key starts with no usage.
docs: https://openrouter.ai/docs/features/provisioning-api-keys
requires:
  account: { kind: openrouter-account, expose: { management_key: OPENROUTER_MANAGEMENT_KEY } }
inputs:
  limit:
    type: number
    min: 0
    label: Credit limit (USD)
    help: "Per sandbox, for example 5."
    required: true
  limit_reset:
    label: Limit resets
    choices:
      '': 'Never: the limit covers the key''s lifetime'
      daily: Daily
      weekly: Weekly
      monthly: Monthly
    default: ""
  include_byok_in_limit:
    advanced: true
    label: Count BYOK usage toward the limit
    default: "true"
outputs:
  key: { sensitive: true }
  hash: {}
  base_url: {}
  anthropic_base_url: {}
runs: { create: provider.py, delete: provider.py, list: provider.py }
timeout: 1m
# Attaching it, or changing its inputs, reaches existing sandboxes when they
# are prepared.
live: true
env:
  OPENROUTER_API_KEY: ${outputs.key}
