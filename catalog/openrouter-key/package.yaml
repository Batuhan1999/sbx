kind: provision
name: openrouter-key
title: OpenRouter API key (per sandbox)
description: >
  An OpenRouter API key per sandbox with its own credit limit, made with the
  account's management key and deleted with the sandbox. The limit caps what
  the key spends; the account's prepaid balance still pays for it, so other
  keys can use that balance up first. Changing an input of an existing sandbox
  replaces its key on the next prepare, and the new key starts with no usage.
docs: https://openrouter.ai/docs/features/provisioning-api-keys
requires:
  account: { kind: openrouter-account, expose: { management_key: OPENROUTER_MANAGEMENT_KEY } }
inputs:
  limit:
    required: true
    help: credit limit of each sandbox's key in USD, for example 5; there is no unlimited key
  limit_reset:
    default: ""
    help: blank for a limit over the key's lifetime, or daily, weekly or monthly (resets at midnight UTC)
  include_byok_in_limit:
    default: "true"
    help: true counts usage on the account's own provider keys (BYOK) against the limit too
outputs:
  key: { sensitive: true }
  hash: {}
  base_url: {}
  anthropic_base_url: {}
runs: { create: provider.py, delete: provider.py, list: provider.py }
timeout: 1m
# Attaching it, or changing its inputs, reaches existing sandboxes when they
# are prepared.
live: true
env:
  OPENROUTER_API_KEY: ${outputs.key}
