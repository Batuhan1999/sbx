kind: connection
name: aws-role
title: AWS development role
logo: logo.svg
description: >
  Connects to a development AWS role with an access key pair that stays on this
  server; sandboxes only ever get temporary credentials for it. An existing host
  profile can sign in instead, for advanced setups.
docs: https://docs.aws.amazon.com/STS/latest/APIReference/API_AssumeRole.html
inputs:
  role_arn:
    help: ARN of the existing development role. Its trust policy must admit this host's identity.
    required: true
  region:
    required: true
    help: AWS region for STS and the sandbox profile, for example eu-central-1
  auth_method:
    label: Sign-in method
    choices:
      '': From the fields filled in
      access_key: Access key (normal setup)
      host_profile: Host profile (advanced)
    help: How this server signs in before it assumes the role.
    default: ""
  access_key_id:
    default: ""
    secret: true
    help: dedicated IAM access key ID; sbx uses it only to assume the development role
  secret_access_key:
    default: ""
    secret: true
    help: secret access key kept on the server; never injected into a sandbox
  session_token:
    default: ""
    secret: true
    help: only for temporary source credentials; these expire and are not unattended access
  source_profile:
    label: Host profile
    help: advanced existing host profile; supports credential_process or Roles Anywhere, while SSO requires reauthorization
    default: ""
  external_id:
    default: ""
    secret: true
    help: external ID required by the role trust policy, if any
check: aws.py
connect: aws.py
# Changing these while sandboxes use the connection would change what they reach.
identity: [role_arn, region]
