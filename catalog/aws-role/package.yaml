kind: connection
name: aws-role
title: AWS development role
logo: logo.svg
description: >
  Connects to a development AWS role with an access key pair that stays on this
  server; sandboxes only ever get temporary credentials for it. An existing host
  profile can sign in instead, for advanced setups.
docs: https://docs.aws.amazon.com/STS/latest/APIReference/API_AssumeRole.html
inputs:
  role_arn:
    help: "Its trust policy must admit this server."
    required: true
  region:
    required: true
    help: "For example eu-central-1."
  auth_method:
    hidden: true
    label: Sign-in method
    choices:
      '': From the fields filled in
      access_key: Access key (normal setup)
      host_profile: Host profile (advanced)
    default: ""
  access_key_id:
    default: ""
    secret: true
  secret_access_key:
    default: ""
    secret: true
  session_token:
    hidden: true
    default: ""
    secret: true
  source_profile:
    hidden: true
    label: Host profile
    default: ""
  external_id:
    advanced: true
    default: ""
    secret: true
    help: "Only if the role's trust policy requires one."
check: aws.py
connect: aws.py
# Changing these while sandboxes use the connection would change what they reach.
identity: [role_arn, region]
