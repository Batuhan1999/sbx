kind: provision
name: upstash-redis
title: Upstash Redis database
logo: logo.svg
description: >
  An empty Redis database per sandbox on your Upstash account, deleted with the
  sandbox. A retry reuses the same database. It never shares a database index or
  key prefix, copies production data, creates an account or upgrades a plan by
  itself. Check a plan's limits and costs before choosing a paid one.
docs: https://upstash.com/docs/devops/developer-api/redis/create_database_global
requires:
  account:
    kind: upstash-account
    expose:
      email: UPSTASH_EMAIL
      api_key: UPSTASH_API_KEY
inputs:
  region:
    label: Primary region
    help: Provider primary_region, such as eu-central-1; select from the account's supported regions.
    required: true
  platform:
    label: Cloud
    choices:
      aws: AWS
      gcp: Google Cloud
    help: Cloud platform, aws or gcp; the selected region must belong to it.
    default: aws
  plan:
    label: Plan
    choices:
      free: Free
      payg: Pay as you go
      fixed_250mb: Fixed 250 MB
      fixed_1gb: Fixed 1 GB
      fixed_5gb: Fixed 5 GB
      fixed_10gb: Fixed 10 GB
      fixed_50gb: Fixed 50 GB
      fixed_100gb: Fixed 100 GB
      fixed_500gb: Fixed 500 GB
    help: A paid plan is never chosen for you.
    default: free
  budget:
    label: Monthly budget (USD)
    help: A whole number, sent to Upstash when the database is made.
    default: '1'
outputs:
  url: { sensitive: true }
  rest_url: {}
  rest_token: { sensitive: true }
  host: {}
  port: {}
  user: {}
  password: { sensitive: true }
  database: {}
  database_id: {}
runs: { create: provider.py, delete: provider.py, list: provider.py }
timeout: 3m
env:
  REDIS_URL: ${outputs.url}
  UPSTASH_REDIS_REST_URL: ${outputs.rest_url}
  UPSTASH_REDIS_REST_TOKEN: ${outputs.rest_token}
