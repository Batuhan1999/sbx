name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # the release workflow runs the same checks on its tag

permissions:
  contents: read

# A new push to a pull request drops its older run.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, the web app, the embed tests and release packaging.
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            control/requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      # Not committed: the release packaging below and its test lay it out.
      - run: npm run build
        working-directory: web
      - run: python -m unittest discover -s embed/tests -q
      - name: Shell syntax and release packaging
        run: |
          git ls-files '*.sh' ':!:vendor/*' | while IFS= read -r file; do
            case "$(head -n1 "$file")" in
              *bash*) bash -n "$file" ;;
              *) sh -n "$file" ;;
            esac
          done
          sh control/release.sh "$RUNNER_TEMP/sbx-release"
          test -f "$RUNNER_TEMP/sbx-release/sbx_control/web_dist/index.html"

  # The control tests, in shards that run side by side (control/tests/shard.py).
  control:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            control/requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      # The release and sign-in tests serve the built web app.
      - run: npm ci && npm run build
        working-directory: web
      - run: python control/tests/shard.py ${{ matrix.shard }} 4
        env:
          PYTHONPATH: control

  # The one required status: passes only when every job above passed.
  check:
    if: always()
    needs: [web, control]
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.web.result }}" = success && test "${{ needs.control.result }}" = success
