name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # the release workflow runs the same checks on its tag

permissions:
  contents: read

# A new push to a pull request drops its older run.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            control/requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m unittest discover -s control/tests -q
        env:
          PYTHONPATH: control
      - run: python -m unittest discover -s embed/tests -q
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: The committed web bundle matches its source
        run: |
          git add -N control/sbx_control/web_dist
          git diff --exit-code --stat control/sbx_control/web_dist || {
            echo "control/sbx_control/web_dist is out of date: run npm run build in web/ and commit the result" >&2
            exit 1
          }
      - name: Shell syntax and release packaging
        run: |
          git ls-files '*.sh' ':!:vendor/*' | while IFS= read -r file; do
            case "$(head -n1 "$file")" in
              *bash*) bash -n "$file" ;;
              *) sh -n "$file" ;;
            esac
          done
          sh control/release.sh "$RUNNER_TEMP/sbx-release"
          test -f "$RUNNER_TEMP/sbx-release/sbx_control/web_dist/index.html"
